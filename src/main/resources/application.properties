# ---- Core ----
spring.application.name=fsp-mcp-generation-svc
server.port=${SERVER_PORT:8100}
server.servlet.context-path=/mcp-generate/v1/api

# ---- MongoDB ----
spring.data.mongodb.uri=${MONGO_URL:mongodb+srv://admin_db_user:HdhPLHmhHEhxSUTa@probestack-prod.mby902c.mongodb.net/probestack-forgeSphere?appName=probestack-prod}
spring.data.mongodb.database=${DB_NAME:probestack-forgesphere}
spring.data.mongodb.auto-index-creation=true

mcpgen.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,https://forgesphere.probestack.io}

# ---- Body size ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---- Logging ----
logging.level.com.forgesphere.mcpgen=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# ---- Gemini AI (for tool synthesis) ----
mcpgen.ai.gemini.api-key=${GEMINI_API_KEY:AIzaSyAhmp8F2PivQJU70ufislIG4eMCKbi4fTk}
mcpgen.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
mcpgen.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# ---- Object storage (zip persistence) ----
forgesphere.storage.bucket=${FORGESPHERE_STORAGE_BUCKET:forgeq-store}
forgesphere.storage.project-id=${FORGESPHERE_STORAGE_PROJECT_ID:probestack-prod}
forgesphere.storage.credentials-encoded=${FORGESPHERE_STORAGE_CREDENTIALS_ENCODED:}
forgesphere.storage.fallback-dir=${FORGESPHERE_STORAGE_FALLBACK_DIR:/tmp/forgesphere-mcp-zips}

# ---- Pipeline deploy (mirror -> api-development deploy-to-github -> onboarding.yml) ----
# fsp-api-development-svc base URL. deployViaPipeline POSTs to
# {this}/v1/api-development/{microserviceId}/deploy-to-github after a mirror.
api-development.service.url=${API_DEVELOPMENT_SERVICE_URL:https://forgesphere.probestack.io/api-development}
# Public base of THIS service — used to build the ZIP_URL the pipeline curls
# ({base}/mcp-generate/v1/api/projects/{id}/artifact.zip).
mcpgen.public-base-url=${MCPGEN_PUBLIC_BASE_URL:https://forgesphere.probestack.io}
# true  -> /push-to-github runs the pipeline path (mirror + dispatch)
# false -> legacy direct Git Data API push (fallback)
mcpgen.deploy.pipeline-enabled=${MCPGEN_DEPLOY_PIPELINE_ENABLED:true}

# ---- Cross-service bridge (mirror MCP artefacts into api-development schema) ----
# Bucket = team's shared artefact bucket (the same one the existing
# api-development service reads from). path-prefix is purely a convention
# so MCP artefacts are easy to spot next to normal microservice artefacts.
forgesphere.bridge.gcs.bucket=${FORGESPHERE_BRIDGE_BUCKET:forgesphere}
forgesphere.bridge.gcs.project-id=${FORGESPHERE_BRIDGE_PROJECT_ID:probestack-prod}
forgesphere.bridge.gcs.credentials-encoded=${FORGESPHERE_BRIDGE_CREDENTIALS_ENCODED:${forgesphere.storage.credentials-encoded}}
forgesphere.bridge.gcs.path-prefix=${FORGESPHERE_BRIDGE_PATH_PREFIX:generated-artifacts/microservice/}
forgesphere.bridge.gcs.content-type=application/zip

# Collection name overrides — change here if the team renames a collection.
forgesphere.bridge.coll.microservice=${FORGESPHERE_BRIDGE_COLL_MICROSERVICE:microservice}
forgesphere.bridge.coll.deployment-artifacts=${FORGESPHERE_BRIDGE_COLL_DEPLOYMENT_ARTIFACTS:deployment_artifacts}
forgesphere.bridge.coll.codegen-results=${FORGESPHERE_BRIDGE_COLL_CODEGEN_RESULTS:codegen_results}
